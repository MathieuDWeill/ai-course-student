name: Student distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check student resources and private-note leaks
        run: python scripts/verify_student_distribution.py
      - name: Test that privacy and navigation failures are rejected
        run: python -m unittest discover -s scripts -p test_student_distribution.py
