name: Student distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF privacy checker
        run: python -m pip install "pypdf>=5,<7"
      - name: Check student resources and private-note leaks
        run: python scripts/verify_student_distribution.py
      - name: Test that privacy and navigation failures are rejected
        run: python -m unittest discover -s scripts -p test_student_distribution.py
  execute-guided-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements-notebook-checks.txt
      - name: Install notebook-check dependencies
        run: python -m pip install -r scripts/requirements-notebook-checks.txt
      - name: Execute the 17 small chapter notebooks
        run: python scripts/check_chapter_notebooks.py
